services:
  db:
    image: postgres:16-alpine
    container_name: website-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-website}
      POSTGRES_USER: ${POSTGRES_USER:-website}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-website}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-website}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: website-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-website}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-website}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-website}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: website-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:
