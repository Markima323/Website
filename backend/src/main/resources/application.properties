spring.application.name=website

# --- Datasource (values come from environment variables, with local defaults) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/website}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:website}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:website}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Actuator (health check endpoint at /actuator/health) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.port=8080
